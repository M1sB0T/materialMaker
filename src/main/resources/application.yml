server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:material_maker}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 每次启动执行 schema.sql + data.sql（脚本本身幂等）
      mode: always
      # 必须显式指定：中文 Windows 平台默认 GBK，会把 UTF-8 种子数据读歪
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 40MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  storage:
    # 上传素材与生成结果的本地存储根目录
    root: ${STORAGE_DIR:./data}
  dev-tools:
    # 演示调试接口（/api/dev/simulation）开关：默认关闭，生产环境务必保持关闭；
    # Docker 演示部署通过环境变量 DEV_TOOLS_ENABLED=true 打开
    enabled: ${DEV_TOOLS_ENABLED:false}

logging:
  level:
    com.bot.materialmaker: INFO

# 模拟生成器配置：每个阶段的模拟耗时（毫秒）与失败注入
# 也可通过开发接口 POST /api/dev/simulation 在运行时调整，便于演示
simulation:
  step-delay-millis:
    MATERIAL_CHECK: 1500
    GENERATING: 3500
    ASSEMBLING: 1500
  fail-phase: ""
