services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      # 凭据支持通过同目录 .env 文件覆盖（参考 .env.example）；
      # 下方默认值仅用于本地/演示开箱即用，生产部署务必用 .env 覆盖
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Root_Only4Demo}
      MYSQL_DATABASE: material_maker
      # 应用专用最小权限账号（MySQL 镜像自动创建并仅授予 material_maker 库权限），应用不再使用 root 连接
      MYSQL_USER: material_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-App_Only4Demo}
    volumes:
      - mysql-data:/var/lib/mysql
      # 建表与种子数据：与本地开发共用同一份脚本，保证幂等
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      # 密码从容器内环境变量读取，不再出现在命令行/ps 输出中
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 3s
      retries: 20
    # 如需从宿主机访问容器 MySQL，可放开（映射到 3307 避免与本机 3306 冲突）
    # ports:
    #   - "3307:3306"

  backend:
    build: .
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: material_maker
      DB_USER: material_app
      DB_PASSWORD: ${DB_PASSWORD:-App_Only4Demo}
      STORAGE_DIR: /app/data
      # 演示环境打开调试接口（/api/dev/simulation）；生产部署删除此行即默认关闭
      DEV_TOOLS_ENABLED: "true"
    volumes:
      - backend-data:/app/data
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_ORIGIN: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql-data:
  backend-data:
